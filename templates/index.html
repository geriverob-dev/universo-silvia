<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#22233F" />
  <title>Un pequeño universo para Silvia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/universo.css" />
</head>
<body>
  <div id="loader" class="loader" aria-live="polite">
    <div class="loader-inner">
      <svg class="loader-moon" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="40" cy="40" r="28" fill="#D8B879" opacity="0.9"/>
        <circle cx="52" cy="32" r="26" fill="#22233F"/>
      </svg>
      <p class="loader-text">Preparando un pequeño universo…</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="shell-header" role="banner">
      <button type="button" id="btn-back" class="shell-btn shell-btn--ghost" aria-label="Escena anterior" disabled>
        <span aria-hidden="true">←</span> Atrás
      </button>
      <nav class="progress" aria-label="Progreso de la historia">
        <ol class="progress-list" id="progress-list"></ol>
      </nav>
      <button type="button" id="btn-sound" class="shell-btn shell-btn--ghost" aria-pressed="false" aria-label="Activar música suave">
        <span class="sound-icon" aria-hidden="true">♪</span>
        <span class="sound-label">Sonido</span>
      </button>
    </header>

    <main id="scene-root" class="scene-root" tabindex="-1"></main>

    <canvas id="petal-canvas" class="petal-canvas" aria-hidden="true"></canvas>
    <div id="star-cursor" class="star-cursor" aria-hidden="true"></div>
  </div>

  <script src="static/js/vendor/gsap.min.js"></script>
  <script src="static/js/vendor/ScrollTrigger.min.js"></script>
  <script src="static/js/audio.js"></script>
  <script src="static/js/flores.js"></script>
  <script src="static/js/pastel.js"></script>
  <script src="static/js/constelacion.js"></script>
  <script src="static/js/mariposas.js"></script>
  <script src="static/js/sobres.js"></script>
  <script src="static/js/carta-final.js"></script>
  <script src="static/js/libro.js"></script>
  <script src="static/js/cielo-estrellas.js"></script>
  <script src="static/js/escenas.js"></script>
  <script src="static/js/director.js"></script>
</body>
</html>
